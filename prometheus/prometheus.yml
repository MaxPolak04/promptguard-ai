global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'promptguard-api'
    static_configs:
      - targets: ['api:8000']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['db_exporter:9187']

  - job_name: 'promptguard-ml'
    static_configs:
      - targets: ['ml:8000']
