name: Proxy Gateway CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'api-gateway/**'
      - '.github/workflows/proxy-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './api-gateway'

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            ./api-gateway/requirements.txt
            ./api-gateway/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt ruff==0.3.0

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (pytest)
        run: pytest -v

  build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t promptguard-api:${{ github.sha }} ./api-gateway
