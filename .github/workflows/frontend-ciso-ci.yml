name: Frontend CISO CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'frontend-ciso/**'
      - '.github/workflows/frontend-ciso-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './frontend-ciso'

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend-ciso/package-lock.json'

      - name: Step 1 - Installing Dependencies
        run: npm ci

      - name: Step 2 - Code Quality (Linters and Formatters)
        run: |
          npm run lint --if-present
          npm run format --if-present

      - name: Step 3 - Unit Tests
        run: npm test --if-present

      - name: Step 4 - DevSecOps Security (SAST)
        run: npm audit

  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Step 5 - Logging in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 6 - Build & Push
        working-directory: ./frontend-ciso
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/frontend-ciso
          IMAGE_BASE=$(echo $IMAGE_BASE | tr '[A-Z]' '[a-z]')
          SHORT_SHA=${GITHUB_SHA::7}

          docker build -t $IMAGE_BASE:latest -t $IMAGE_BASE:$SHORT_SHA .
          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:$SHORT_SHA


  release:
    name: Trigger Release
    needs: build
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: 'frontend-ciso'
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
