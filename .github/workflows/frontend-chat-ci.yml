name: Frontend Chat CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'frontend-chat/**'
      - '.github/workflows/frontend-chat-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './frontend-chat'

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: './frontend-chat/package-lock.json'

      - name: Step 1 - Installing Dependencies
        run: npm ci

      - name: Step 2 - Code Quality (Linters and Formatters)
        run: |
          npm run lint --if-present
          npm run format --if-present

      - name: Step 3 - Unit Tests
        run: npm test --if-present

      - name: Step 4 - DevSecOps Security (SAST)
        run: npm audit

      - name: Setup Python specifically for Secret Scanner
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Step 5 - Secret Detection
        run: |
          pip install detect-secrets
          detect-secrets scan > secrets-report.json
          if [ "$(jq '.results | length' secrets-report.json)" -gt 0 ]; then
            echo "❌ CRITICAL: Potential secrets have been detected in the React/JS code!"
            cat secrets-report.json
            exit 1
          else
            echo "✅ Scan complete. No leaks detected."
          fi

  build-and-scan:
    name: Build and Scan Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Build Local Image for Security Audit
        working-directory: ./frontend-chat
        run: |
          docker build -t frontend-chat:test .

      - name: Step 6 - Trivy Vulnerability Scanner (Container Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'frontend-chat:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Step 7 - Logging in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 8 - Push Verified Image to GHCR
        working-directory: ./frontend-chat
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/frontend-chat
          IMAGE_BASE=$(echo $IMAGE_BASE | tr '[A-Z]' '[a-z]')
          SHORT_SHA=${GITHUB_SHA::7}

          docker tag frontend-chat:test $IMAGE_BASE:latest
          docker tag frontend-chat:test $IMAGE_BASE:$SHORT_SHA

          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:$SHORT_SHA


  release:
    name: Trigger Release
    needs: build-and-scan
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: 'frontend-chat'
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
