name: ML Classifier CI

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths:
      - 'ml-classifier/**'
      - '.github/workflows/ml-classifier-ci.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build, Test and Analyze
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: './ml-classifier'

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: './ml-classifier/requirements.txt'

      - name: Step 1 - Installing Dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Step 2 - Code Quality (Linters and Formatters)
        run: |
          pip install ruff
          ruff check app/ tests/
          ruff format --check app/ tests/

      - name: Step 3 - Unit Tests
        run: pytest

      - name: Step 4 - DevSecOps Security (SAST)
        run: |
          pip install bandit
          bandit -r app/


  build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Download the repository code
        uses: actions/checkout@v4

      - name: Step 5 - Logging in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Step 6 - Build & Push
        working-directory: ./ml-classifier
        run: |
          IMAGE_BASE=ghcr.io/${{ github.repository_owner }}/ml-classifier
          IMAGE_BASE=$(echo $IMAGE_BASE | tr '[A-Z]' '[a-z]')
          SHORT_SHA=${GITHUB_SHA::7}

          docker build -t $IMAGE_BASE:latest -t $IMAGE_BASE:$SHORT_SHA .
          docker push $IMAGE_BASE:latest
          docker push $IMAGE_BASE:$SHORT_SHA


  release:
    name: Trigger Release
    needs: build
    if: github.event.pull_request.merged == true
    uses: ./.github/workflows/reusable-release.yml
    with:
      app_name: 'ml-classifier'
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body }}
